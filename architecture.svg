<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- 定义渐变色 -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradient3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradient4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#43e97b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38f9d7;stop-opacity:1" />
    </linearGradient>
    
    <!-- 阴影效果 -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#2d3748">
    FusionSearch 混合搜索架构
  </text>
  
  <!-- 上层：用户查询 -->
  <g filter="url(#shadow)">
    <rect x="300" y="70" width="200" height="60" rx="10" fill="url(#gradient1)"/>
    <text x="400" y="95" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
      用户查询
    </text>
    <text x="400" y="115" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">
      "芹菜炒肉"
    </text>
  </g>
  
  <!-- 箭头 -->
  <path d="M 400 130 L 400 160" stroke="#718096" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- 中层左：Python/Swift/Kotlin 调度层 -->
  <g filter="url(#shadow)">
    <rect x="50" y="170" width="300" height="120" rx="10" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <text x="200" y="195" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2d3748">
      上层调度（Python/Swift/Kotlin）
    </text>
    
    <!-- 调度层功能点 -->
    <text x="70" y="220" font-family="Arial, sans-serif" font-size="12" fill="#4a5568">
      ✓ 调用 API 获取 Query 向量
    </text>
    <text x="70" y="240" font-family="Arial, sans-serif" font-size="12" fill="#4a5568">
      ✓ 调度 C 的 BM25 搜索
    </text>
    <text x="70" y="260" font-family="Arial, sans-serif" font-size="12" fill="#4a5568">
      ✓ 调度 C 的向量检索
    </text>
    <text x="70" y="280" font-family="Arial, sans-serif" font-size="12" fill="#4a5568">
      ✓ 融合排序（RRF）
    </text>
  </g>
  
  <!-- 中层右：外部 API -->
  <g filter="url(#shadow)">
    <rect x="450" y="170" width="300" height="80" rx="10" fill="url(#gradient2)"/>
    <text x="600" y="195" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
      SiliconFlow API
    </text>
    <text x="600" y="220" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">
      BAAI/bge-m3 (1024维)
    </text>
    <text x="600" y="240" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">
      向量化 Query
    </text>
  </g>
  
  <!-- 连接线：调度层 → API -->
  <path d="M 350 210 L 450 210" stroke="#718096" stroke-width="2" stroke-dasharray="5,5" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- FFI 分界线 -->
  <line x1="30" y1="320" x2="770" y2="320" stroke="#cbd5e0" stroke-width="2" stroke-dasharray="10,5"/>
  <text x="400" y="315" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#718096">
    FFI / JNI 调用边界
  </text>
  
  <!-- 下层：C 核心引擎 -->
  <g filter="url(#shadow)">
    <rect x="50" y="340" width="700" height="220" rx="10" fill="white" stroke="#e2e8f0" stroke-width="3"/>
    <text x="400" y="365" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#2d3748">
      C 核心引擎（libfusion.so / .dylib）
    </text>
  </g>
  
  <!-- BM25 模块 -->
  <g filter="url(#shadow)">
    <rect x="80" y="380" width="200" height="150" rx="8" fill="url(#gradient3)"/>
    <text x="180" y="405" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="white">
      BM25 全文检索
    </text>
    <text x="100" y="430" font-family="Arial, sans-serif" font-size="11" fill="white">
      • Trie 字典树
    </text>
    <text x="100" y="450" font-family="Arial, sans-serif" font-size="11" fill="white">
      • 倒排索引
    </text>
    <text x="100" y="470" font-family="Arial, sans-serif" font-size="11" fill="white">
      • BM25 排序
    </text>
    <text x="100" y="490" font-family="Arial, sans-serif" font-size="11" fill="white">
      • 中文分词（ICU）
    </text>
    <text x="100" y="510" font-family="Arial, sans-serif" font-size="11" fill="white">
      ⚡ &lt; 0.1ms 检索
    </text>
  </g>
  
  <!-- 向量检索模块 -->
  <g filter="url(#shadow)">
    <rect x="320" y="380" width="200" height="150" rx="8" fill="url(#gradient4)"/>
    <text x="420" y="405" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="white">
      向量语义检索
    </text>
    <text x="340" y="430" font-family="Arial, sans-serif" font-size="11" fill="white">
      • 余弦相似度
    </text>
    <text x="340" y="450" font-family="Arial, sans-serif" font-size="11" fill="white">
      • 暴力检索（&lt;10万文档）
    </text>
    <text x="340" y="470" font-family="Arial, sans-serif" font-size="11" fill="white">
      • 二进制存储
    </text>
    <text x="340" y="490" font-family="Arial, sans-serif" font-size="11" fill="white">
      • UTF-8 安全
    </text>
    <text x="340" y="510" font-family="Arial, sans-serif" font-size="11" fill="white">
      ⚡ ~10ms 检索
    </text>
  </g>
  
  <!-- 文档存储模块 -->
  <g filter="url(#shadow)">
    <rect x="560" y="380" width="160" height="150" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="2"/>
    <text x="640" y="405" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#2d3748">
      文档存储
    </text>
    <text x="580" y="430" font-family="Arial, sans-serif" font-size="11" fill="#4a5568">
      • JSONL 加载
    </text>
    <text x="580" y="450" font-family="Arial, sans-serif" font-size="11" fill="#4a5568">
      • vectors.bin
    </text>
    <text x="580" y="470" font-family="Arial, sans-serif" font-size="11" fill="#4a5568">
      • 按需查询
    </text>
    <text x="580" y="490" font-family="Arial, sans-serif" font-size="11" fill="#4a5568">
      • 内存优化
    </text>
    <text x="580" y="510" font-family="Arial, sans-serif" font-size="11" fill="white">
      　
    </text>
  </g>
  
  <!-- 箭头标记定义 -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#718096" />
    </marker>
  </defs>
  
  <!-- 数据流箭头 -->
  <path d="M 400 160 L 200 170" stroke="#718096" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 200 290 L 180 340" stroke="#48bb78" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 200 290 L 420 340" stroke="#48bb78" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- 返回结果箭头 -->
  <g>
    <path d="M 180 380 L 150 330" stroke="#ed8936" stroke-width="2" stroke-dasharray="5,3" fill="none"/>
    <path d="M 420 380 L 250 330" stroke="#ed8936" stroke-width="2" stroke-dasharray="5,3" fill="none"/>
    <text x="60" y="350" font-family="Arial, sans-serif" font-size="10" fill="#ed8936">
      doc_id + score
    </text>
  </g>
  
  <!-- 底部说明 -->
  <rect x="50" y="570" width="700" height="20" rx="5" fill="#edf2f7"/>
  <text x="400" y="584" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#4a5568">
    ⚙️ 纯 C99 标准库 | 📦 轻量级（~500KB） | 🚀 跨平台（iOS/Android） | 🔒 本地化，无需网络
  </text>
</svg>
